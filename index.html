<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Portal CADCAM BRASIL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .bg-logo-fundo {
            /* AJUSTE AQUI: O nome tem que ser igual ao arquivo na sua pasta */
            background-image: url('logo-cadcam.png'); 
            background-repeat: no-repeat; background-position: center; background-size: 50%;
            opacity: 0.1; position: fixed; inset: 0; z-index: 0; pointer-events: none;
        }
        .glass-card { background: white; z-index: 10; width: 100%; max-width: 400px; padding: 2rem; border-radius: 1.5rem; position: relative; }
    </style>
</head>
<body>
    <div class="bg-logo-fundo"></div>

    <div class="glass-card">
        <h1 class="text-2xl font-bold text-center mb-6">CADCAM BRASIL</h1>
        <form id="auth-form" class="space-y-4">
            <div id="campo-nome" class="hidden">
                <input type="text" id="nome" placeholder="Nome Completo" class="w-full p-2 border rounded">
            </div>
            <input type="email" id="email" placeholder="E-mail" class="w-full p-2 border rounded" required>
            <input type="password" id="password" placeholder="Senha" class="w-full p-2 border rounded" required>
            <button type="submit" id="btn-principal" class="w-full bg-blue-600 text-white p-2 rounded font-bold">Entrar</button>
        </form>
        <div class="mt-4 text-center text-sm">
            <button onclick="ativarModoCadastro()" class="text-blue-600 underline">Criar conta nova</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, sendEmailVerification, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA9FjKajgp5_rM-Yoml8CwGCAxanMfWzS4",
            authDomain: "cadcam-portal.firebaseapp.com",
            projectId: "cadcam-portal",
            storageBucket: "cadcam-portal.firebasestorage.app",
            messagingSenderId: "513261687046",
            appId: "1:513261687046:web:190a1f709124b97eb94e87"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.ativarModoCadastro = () => {
            document.getElementById('campo-nome').classList.remove('hidden');
            document.getElementById('btn-principal').innerText = "Cadastrar e Verificar E-mail";
            window.modoCadastro = true;
        };

        document.getElementById('auth-form').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;

            if (window.modoCadastro) {
                try {
                    const res = await createUserWithEmailAndPassword(auth, email, pass);
                    await sendEmailVerification(res.user);
                    alert("E-mail de verificação enviado! Confira sua caixa de entrada.");
                } catch (err) { alert("Erro: " + err.message); }
            } else {
                try {
                    await signInWithEmailAndPassword(auth, email, pass);
                    alert("Logado com sucesso!");
                } catch (err) { alert("Erro no login!"); }
            }
        };
    </script>
</body>
</html>
